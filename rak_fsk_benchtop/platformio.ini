[env:rak3401_1watt]
platform = nordicnrf52
; Matches Meshtastic's own env for this hardware (variants/nrf52840/rak3401_1watt/platformio.ini):
; the RAK3401 is a RAK4631 board variant, not a Feather -- the bootloader/flash
; layout differ, so `board` must be wiscore_rak4631, not adafruit_feather_nrf52840.
; wiscore_rak4631 isn't a stock platform-nordicnrf52 board, so its JSON is
; vendored locally under boards/ (PlatformIO auto-discovers boards/*.json).
board = wiscore_rak4631
framework = arduino

; RAK13302's SX1262+PA pin map, vendored from meshtastic/firmware
; variants/nrf52840/rak3401_1watt (CS 26, DIO1 10, BUSY 9, reset 4, PA-enable 21,
; DIO2 RF-switch, 1.8V TCXO on DIO3). See variants/rak3401_1watt/variant.h.
board_build.variants_dir = variants
board_build.variant = rak3401_1watt

monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ ^7.3.0
